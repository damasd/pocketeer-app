<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log transaction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#111111}
input::placeholder{color:#6B6B6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #7D7D7D; color: #111111; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">

<sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; top: 4px; left: 20px; right: 20px; height: 36px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 999px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; z-index: 2">
<span>Saved · {{ display }}</span>
<button type="button" onClick="{{ undo }}" style="height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: #D1FC00; color: #111111; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Undo</button>
</div>
</sc-if>

<section role="dialog" aria-label="Log transaction" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; box-sizing: border-box; padding: 10px 20px 24px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #E4E4E4; align-self: center"></div>

<div style="display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<h1 style="flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 700">Log transaction</h1>
<button type="button" aria-label="Speak a transaction" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: #F2F2F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button type="button" aria-label="Scan a receipt" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: #F2F2F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
</div>

<div role="group" aria-label="Transaction type" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F2F2F2">
<sc-for list="{{ typeItems }}" as="item" hint-placeholder-count="4">
<button type="button" onClick="{{ item.pick }}" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: {{ item.bg }}; color: {{ item.fg }}; font: inherit; font-size: 13px; font-weight: {{ item.weight }}; cursor: pointer">{{ item.label }}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 2px 0">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Amount</span>
<span style="font-size: 42px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2">{{ display }}</span>
</div>

<sc-if value="{{ hasCats }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Category</span>
<div style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden">
<sc-for list="{{ catItems }}" as="item" hint-placeholder-count="5">
<button type="button" onClick="{{ item.pick }}" style="flex: none; height: 36px; padding: 0 14px; border: 1px solid {{ item.border }}; border-radius: 999px; background: {{ item.bg }}; color: #111111; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{ item.label }}</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">{{ fromLabel }}</span>
<button type="button" style="height: 56px; padding: 0 14px; border: 0; border-radius: 16px; background: #F2F2F2; display: flex; align-items: center; gap: 12px; font: inherit; color: #111111; text-align: left; cursor: pointer">
<span style="width: 32px; height: 32px; flex: none; border-radius: 50%; background: #111111; color: #D1FC00; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{ fromShort }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{ fromName }}</span><span style="font-size: 12px; color: #6B6B6B">{{ fromBal }}</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
</button>
</div>

<sc-if value="{{ showTo }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">To</span>
<button type="button" style="height: 56px; padding: 0 14px; border: 0; border-radius: 16px; background: #F2F2F2; display: flex; align-items: center; gap: 12px; font: inherit; color: #111111; text-align: left; cursor: pointer">
<span style="width: 32px; height: 32px; flex: none; border-radius: 50%; background: #D1FC00; color: #111111; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{ toShort }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{ toName }}</span><span style="font-size: 12px; color: #6B6B6B">{{ toBal }}</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
</button>
</div>
</sc-if>

<div style="display: flex; gap: 8px">
<button type="button" style="flex: none; height: 44px; padding: 0 14px; border: 1px solid #E4E4E4; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 600; color: #111111; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</button>
<input type="text" aria-label="Note" placeholder="Note (optional)" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 999px; background: #F2F2F2; font: inherit; font-size: 14px; color: #111111">
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, 52px); gap: 8px">
<button type="button" onClick="{{ k1 }}" style="grid-column: 1; grid-row: 1; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">1</button>
<button type="button" onClick="{{ k2 }}" style="grid-column: 2; grid-row: 1; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">2</button>
<button type="button" onClick="{{ k3 }}" style="grid-column: 3; grid-row: 1; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">3</button>
<button type="button" onClick="{{ back }}" aria-label="Delete last digit" style="grid-column: 4; grid-row: 1; border: 0; border-radius: 16px; background: #F2F2F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="m12 9 5 5M17 9l-5 5"/></svg></button>
<button type="button" onClick="{{ k4 }}" style="grid-column: 1; grid-row: 2; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">4</button>
<button type="button" onClick="{{ k5 }}" style="grid-column: 2; grid-row: 2; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">5</button>
<button type="button" onClick="{{ k6 }}" style="grid-column: 3; grid-row: 2; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">6</button>
<button type="button" onClick="{{ save }}" style="grid-column: 4; grid-row: 2 / span 3; border: 0; border-radius: 16px; background: #D1FC00; font: inherit; font-size: 17px; font-weight: 700; color: #111111; cursor: pointer">Save</button>
<button type="button" onClick="{{ k7 }}" style="grid-column: 1; grid-row: 3; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">7</button>
<button type="button" onClick="{{ k8 }}" style="grid-column: 2; grid-row: 3; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">8</button>
<button type="button" onClick="{{ k9 }}" style="grid-column: 3; grid-row: 3; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">9</button>
<button type="button" onClick="{{ k0 }}" style="grid-column: 1 / span 2; grid-row: 4; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 22px; font-weight: 600; color: #111111; cursor: pointer">0</button>
<button type="button" onClick="{{ k000 }}" style="grid-column: 3; grid-row: 4; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 20px; font-weight: 600; color: #111111; cursor: pointer">000</button>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amt: '35000', type: 'Expense', cat: 'Food 2', saved: false };
  }
  press(d) {
    const cur = this.state.saved ? '' : this.state.amt;
    let next = (cur + d).replace(/^0+/, '');
    if (next.length > 12) next = cur;
    this.setState({ amt: next, saved: false });
  }
  renderVals() {
    const s = this.state;
    const cats = {
      Expense: ['Food 2', 'Food', 'Transportation', 'Transportation 2', 'Shopping', 'Subscription', 'Entertainment'],
      Income: ['Salary', 'Bonus', 'Other Income'],
      Transfer: [],
      Saving: ['Emergency Fund', 'Gold', 'Reksadana', 'Indo Stock', 'US Stock', 'Crypto']
    };
    const from = {
      Expense: ['GP', 'GoPay', 'Rp 182.000'],
      Income: ['BCA', 'BCA', 'Rp 4.205.000'],
      Transfer: ['BCA', 'BCA', 'Rp 4.205.000'],
      Saving: ['BCA', 'BCA', 'Rp 4.205.000']
    }[s.type];
    const to = s.type === 'Saving' ? ['PG', 'Pegadaian', 'Rp 2.500.000'] : ['GP', 'GoPay', 'Rp 182.000'];
    const digits = s.amt || '0';
    const display = 'Rp ' + digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const typeItems = ['Expense', 'Income', 'Transfer', 'Saving'].map((t) => ({
      label: t,
      bg: t === s.type ? '#111111' : 'transparent',
      fg: t === s.type ? '#FFFFFF' : '#4A4A4A',
      weight: t === s.type ? 600 : 500,
      pick: () => this.setState({ type: t, cat: cats[t][0] || null, saved: false })
    }));
    const catItems = cats[s.type].map((c) => ({
      label: c,
      bg: c === s.cat ? '#D1FC00' : '#FFFFFF',
      border: c === s.cat ? '#D1FC00' : '#E4E4E4',
      pick: () => this.setState({ cat: c })
    }));
    const k = (d) => () => this.press(d);
    return {
      display, typeItems, catItems,
      hasCats: catItems.length > 0,
      showTo: s.type === 'Transfer' || s.type === 'Saving',
      fromLabel: { Expense: 'Pay from', Income: 'Into', Transfer: 'From', Saving: 'From' }[s.type],
      fromShort: from[0], fromName: from[1], fromBal: from[2],
      toShort: to[0], toName: to[1], toBal: to[2],
      saved: s.saved,
      k1: k('1'), k2: k('2'), k3: k('3'), k4: k('4'), k5: k('5'),
      k6: k('6'), k7: k('7'), k8: k('8'), k9: k('9'), k0: k('0'), k000: k('000'),
      back: () => this.setState({ amt: s.amt.slice(0, -1), saved: false }),
      save: () => this.setState({ saved: true }),
      undo: () => this.setState({ saved: false })
    };
  }
}
</script>
</body>
</html>
