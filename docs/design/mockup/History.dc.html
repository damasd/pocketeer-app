<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>All transactions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#111111}
</style>
</helmet>
<div style="width: 390px; height: 1620px; position: relative; box-sizing: border-box; padding: 20px 20px 120px; background: #F2F2F2; color: #111111; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<header style="padding-top: 12px; display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="Back to Home" style="width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid #E4E4E4; background: #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
<h1 style="flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 700">Transactions</h1>
<button type="button" aria-label="Search transactions" style="width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid #E4E4E4; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
</header>

<div style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden">
<button type="button" style="flex: none; height: 36px; padding: 0 12px 0 14px; border-radius: 999px; border: 0; background: #111111; color: #FFFFFF; display: flex; align-items: center; gap: 4px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">December<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
<button type="button" style="flex: none; height: 36px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid #E4E4E4; background: #FFFFFF; color: #111111; display: flex; align-items: center; gap: 4px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">All wallets<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
<button type="button" style="flex: none; height: 36px; padding: 0 12px 0 14px; border-radius: 999px; border: 1px solid #E4E4E4; background: #FFFFFF; color: #111111; display: flex; align-items: center; gap: 4px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">All categories<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<div role="group" aria-label="Transaction type" style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden">
<sc-for list="{{ typeChips }}" as="item" hint-placeholder-count="5">
<button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ item.border }}; background: {{ item.bg }}; color: #111111; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{ item.label }}</button>
</sc-for>
</div>

<span style="font-size: 13px; color: #6B6B6B">{{ countLabel }}</span>

<div style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px 8px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
<div style="font-size: 12px; font-weight: 600; color: #6B6B6B; padding: 12px 0 2px">{{ g.label }}</div>
<sc-for list="{{ g.items }}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
<span style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: {{ t.iconBg }}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{ t.iconStroke }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{ t.name }}</span><span style="font-size: 12px; color: #6B6B6B">{{ t.sub }}</span></div>
<span style="font-size: 15px; font-weight: 600; white-space: nowrap">{{ t.amount }}</span>
</div>
</sc-for>
</sc-for>
</div>

<nav aria-label="Main" style="position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: 320px; height: 56px; box-sizing: border-box; padding: 0 12px; background: #111111; border-radius: 999px; box-shadow: 0 10px 30px rgba(17, 17, 17, 0.28); display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Home" aria-current="page" style="width: 44px; height: 44px; border-radius: 50%; background: #2E2E2E; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
<a href="Wallet.dc.html" aria-label="Account" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #9A9A9A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/></svg></a>
<a href="Log.dc.html" aria-label="Log transaction" style="width: 68px; height: 68px; flex: none; border-radius: 50%; background: #D1FC00; box-shadow: 0 6px 16px rgba(17, 17, 17, 0.25); display: flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
<a href="Analytics.dc.html" aria-label="Analytics" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #9A9A9A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg></a>
<a href="Budgets.dc.html" aria-label="Plan: budget and goals" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #9A9A9A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All' };
  }
  renderVals() {
    const f = this.state.filter;
    const icons = {
      food: 'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1-3 3.5-3 6.5V13h3v8',
      transport: 'M8 3h8a3 3 0 0 1 3 3v12H5V6a3 3 0 0 1 3-3zM5 11h14M8 21v-3M16 21v-3',
      sub: 'M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5',
      shop: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2',
      fun: 'M8 5v14l11-7z',
      saving: 'M20 12a8 8 0 1 1-16 0a8 8 0 1 1 16 0zM16 12a4 4 0 1 1-8 0a4 4 0 1 1 8 0z',
      transfer: 'M4 8h13M13 4l4 4-4 4M20 16H7M11 12l-4 4 4 4',
      income: 'M17 7 7 17M7 9v8h8'
    };
    const data = [
      ['Today', 'Nasi padang', 'Food 2 · GoPay', -35000, 'Expense', 'food'],
      ['Today', 'Lunch at the office', 'Food · BCA', -45000, 'Expense', 'food'],
      ['Today', 'KRL to office', 'Transportation · Jago', -8000, 'Expense', 'transport'],
      ['Yesterday', 'Gold savings', 'Saving · BCA → Pegadaian', 500000, 'Saving', 'saving'],
      ['Yesterday', 'Netflix', 'Subscription · BCA', -186000, 'Expense', 'sub'],
      ['Sat, 5 Dec', 'Uniqlo', 'Shopping · HSBC', -399000, 'Expense', 'shop'],
      ['Sat, 5 Dec', 'GoPay top-up', 'Transfer · BCA → GoPay', 200000, 'Transfer', 'transfer'],
      ['Fri, 4 Dec', 'Coffee with the team', 'Food · GoPay', -42000, 'Expense', 'food'],
      ['Fri, 4 Dec', 'Grab home', 'Transportation 2 · GoPay', -56000, 'Expense', 'transport'],
      ['Fri, 4 Dec', 'Reksadana', 'Saving · Jago → Bibit', 300000, 'Saving', 'saving'],
      ['Thu, 3 Dec', 'Emergency fund', 'Saving · stays in Jago', 500000, 'Saving', 'saving'],
      ['Thu, 3 Dec', 'Lunch', 'Food · Cash', -38000, 'Expense', 'food'],
      ['Wed, 2 Dec', 'Spotify', 'Subscription · BCA', -55000, 'Expense', 'sub'],
      ['Wed, 2 Dec', 'Cinema', 'Entertainment · HSBC', -100000, 'Expense', 'fun'],
      ['Tue, 1 Dec', 'Indo Stock', 'Saving · BCA → iPOT', 200000, 'Saving', 'saving'],
      ['Wed, 25 Nov', 'Salary', 'Salary · BCA', 8500000, 'Income', 'income'],
      ['Wed, 25 Nov', 'Freelance project', 'Other Income · Jago', 400000, 'Income', 'income']
    ];
    const fmt = (v) => 'Rp ' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const rows = data.filter((r) => f === 'All' || r[4] === f);
    const groups = [];
    rows.forEach((r) => {
      let g = groups.find((x) => x.label === r[0]);
      if (!g) { g = { label: r[0], items: [] }; groups.push(g); }
      g.items.push({
        name: r[1],
        sub: r[2],
        amount: r[4] === 'Expense' ? '−' + fmt(r[3]) : r[4] === 'Income' ? '+' + fmt(r[3]) : fmt(r[3]),
        d: icons[r[5]],
        iconBg: r[4] === 'Saving' ? '#D1FC00' : r[4] === 'Income' ? '#111111' : '#F2F2F2',
        iconStroke: r[4] === 'Income' ? '#FFFFFF' : '#111111'
      });
    });
    const typeChips = ['All', 'Expense', 'Income', 'Transfer', 'Saving'].map((t) => ({
      label: t,
      pressed: t === f ? 'true' : 'false',
      bg: t === f ? '#D1FC00' : '#FFFFFF',
      border: t === f ? '#D1FC00' : '#E4E4E4',
      pick: () => this.setState({ filter: t })
    }));
    return {
      typeChips,
      groups,
      countLabel: rows.length + (rows.length === 1 ? ' transaction' : ' transactions') + ' · 25 Nov – 24 Dec'
    };
  }
}
</script>
</body>
</html>
