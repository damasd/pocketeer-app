<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#111111}
input::placeholder{color:#6B6B6B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #7D7D7D; color: #111111; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">

<sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; top: 4px; left: 20px; right: 20px; height: 36px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 999px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; z-index: 2">
<span>{{ doneLabel }}</span>
<a href="Wallet.dc.html" style="height: 28px; padding: 0 12px; border-radius: 999px; background: #D1FC00; color: #111111; display: flex; align-items: center; font-size: 13px; font-weight: 700; text-decoration: none">View accounts</a>
</div>
</sc-if>

<section role="dialog" aria-label="New account" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; box-sizing: border-box; padding: 10px 20px 24px; background: #FFFFFF; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #E4E4E4; align-self: center"></div>

<div style="display: flex; align-items: center; gap: 8px">
<a href="Wallet.dc.html" aria-label="Close" style="width: 40px; height: 40px; flex: none; border-radius: 50%; background: #F2F2F2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.25" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
<h1 style="flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 700">New account</h1>
<span aria-hidden="true" style="width: 40px; flex: none"></span>
</div>

<div aria-label="Card preview" role="img" style="position: relative; overflow: hidden; height: 190px; flex: none; box-sizing: border-box; border-radius: 24px; padding: 20px; background: {{ c.bg }}; border: {{ c.border }}; color: {{ c.fg }}; display: flex; flex-direction: column; justify-content: space-between">
<span aria-hidden="true" style="position: absolute; right: -70px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: {{ c.circle }}"></span>
<span style="position: relative; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 700; color: {{ nameColor }}">{{ shownName }}</span><sc-if value="{{ hasAcct }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: {{ c.muted }}">{{ acctMasked }}</span></sc-if></span>
<span style="position: relative; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 500; color: {{ c.muted }}">Balance</span><span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em">{{ shownBal }}</span></span>
</div>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Name</span>
<input type="text" value="{{ name }}" onChange="{{ setName }}" placeholder="e.g. Mandiri" maxlength="24" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: {{ nameBorder }}; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 15px; font-weight: 600; color: #111111">
</label>
<sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
<span style="margin-top: -8px; font-size: 13px; font-weight: 500; color: #D92D20">Give the account a name first</span>
</sc-if>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Account number (optional)</span>
<input type="text" inputMode="numeric" value="{{ acct }}" onChange="{{ setAcct }}" placeholder="e.g. 1234567890" style="height: 48px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 16px; background: #F2F2F2; font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: #111111">
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Type</span>
<div role="group" aria-label="Account type" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #F2F2F2">
<sc-for list="{{ kinds }}" as="item" hint-placeholder-count="2">
<button type="button" onClick="{{ item.pick }}" aria-pressed="{{ item.pressed }}" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: {{ item.bg }}; color: {{ item.fg }}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{ item.label }}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Colour</span>
<div role="group" aria-label="Card colour" style="display: flex; gap: 14px">
<sc-for list="{{ swatches }}" as="item" hint-placeholder-count="4">
<button type="button" onClick="{{ item.pick }}" aria-label="{{ item.label }}" aria-pressed="{{ item.pressed }}" style="width: 40px; height: 40px; border-radius: 50%; border: {{ item.border }}; background: {{ item.bg }}; box-shadow: {{ item.ring }}; cursor: pointer"></button>
</sc-for>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 500; color: #6B6B6B">Starting balance</span>
<span style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #F2F2F2; display: flex; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600; color: #6B6B6B">Rp</span><input type="text" inputMode="numeric" value="{{ balShown }}" onChange="{{ setBal }}" aria-label="Starting balance in rupiah" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #111111"></span>
</label>

<button type="button" onClick="{{ create }}" style="margin-top: auto; height: 56px; flex: none; border: 0; border-radius: 999px; background: #D1FC00; font: inherit; font-size: 16px; font-weight: 700; color: #111111; cursor: pointer">Create account</button>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', acct: '', kind: 'Spending', color: 'Black', bal: '0', tried: false, done: false };
  }
  renderVals() {
    const s = this.state;
    const palette = {
      Black: { bg: '#111111', fg: '#FFFFFF', muted: '#BDBDBD', circle: 'rgba(255, 255, 255, 0.06)', border: '0' },
      Lime: { bg: '#D1FC00', fg: '#111111', muted: '#333333', circle: 'rgba(17, 17, 17, 0.06)', border: '0' },
      White: { bg: '#FFFFFF', fg: '#111111', muted: '#6B6B6B', circle: 'rgba(17, 17, 17, 0.04)', border: '1px solid #E4E4E4' },
      Grey: { bg: '#E4E4E4', fg: '#111111', muted: '#4A4A4A', circle: 'rgba(255, 255, 255, 0.4)', border: '0' }
    };
    const c = palette[s.color];
    const dots = (d) => d.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const name = s.name.trim();
    const showError = s.tried && !name;
    const swatches = Object.keys(palette).map((k) => ({
      label: k,
      pressed: k === s.color ? 'true' : 'false',
      bg: palette[k].bg,
      border: k === 'White' ? '1px solid #E4E4E4' : '0',
      ring: k === s.color ? '0 0 0 3px #FFFFFF, 0 0 0 5px #111111' : 'none',
      pick: () => this.setState({ color: k })
    }));
    return {
      c,
      swatches,
      name: s.name,
      shownName: name || 'Account name',
      nameColor: name ? c.fg : c.muted,
      shownBal: 'Rp ' + dots(s.bal || '0'),
      balShown: dots(s.bal || '0'),
      showError,
      nameBorder: showError ? '1.5px solid #D92D20' : '1.5px solid transparent',
      done: s.done,
      doneLabel: (name || 'Account') + ' added',
      kinds: ['Spending', 'Saving'].map((k) => ({ label: k, pressed: k === s.kind ? 'true' : 'false', bg: k === s.kind ? '#111111' : 'transparent', fg: k === s.kind ? '#FFFFFF' : '#4A4A4A', pick: () => this.setState({ kind: k }) })),
      acct: s.acct,
      hasAcct: s.acct.length >= 4,
      acctMasked: '•••• ' + s.acct.slice(-4),
      setAcct: (e) => this.setState({ acct: e.target.value.replace(/\D/g, '').slice(0, 20), done: false }),
      setName: (e) => this.setState({ name: e.target.value, done: false }),
      setBal: (e) => {
        const d = e.target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
        this.setState({ bal: d || '0', done: false });
      },
      create: () => this.setState(name ? { tried: true, done: true } : { tried: true, done: false })
    };
  }
}
</script>
</body>
</html>
